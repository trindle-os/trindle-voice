[package]
name = "trindle-voice"
description = "Trindle Voice: a maintained fork of Supertonic, on-device text to speech in pure Rust"
version = "0.1.0"
authors = ["Trindle <voice@trindle.org>"]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
repository = "https://github.com/trindle-os/trindle-voice"
readme = "README.md"

[dependencies]
tract-onnx = "0.23.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
rand_distr = "0.6"
sha2 = "0.11"
unicode-normalization = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

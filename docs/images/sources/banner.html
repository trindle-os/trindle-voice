<!doctype html><meta charset=utf-8><style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:360px}
body{background:#14202b;font-family:system-ui,"Helvetica Neue",Arial,sans-serif;color:#f4f7fa;position:relative;overflow:hidden;display:flex;align-items:center;gap:56px;padding:0 72px}
.glow{position:absolute;inset:0;background:radial-gradient(620px 420px at 86% 14%,rgba(64,201,176,.22),transparent 68%),radial-gradient(520px 380px at 8% 92%,rgba(120,160,255,.12),transparent 70%)}
.mark{position:relative;width:150px;height:150px;border-radius:34px;background:#40c9b0;display:flex;align-items:center;justify-content:center;gap:9px;flex:none;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.mark i{display:block;width:12px;border-radius:6px;background:#14202b}
.words{position:relative}
h1{font-size:78px;font-weight:650;letter-spacing:-.025em;line-height:1}
p{font-size:26px;color:#b9c6d2;margin-top:14px}
.chips{display:flex;gap:10px;margin-top:26px}
.chip{font-size:15px;font-weight:600;padding:8px 15px;border-radius:999px;background:#1f3040;border:1px solid rgba(255,255,255,.14);color:#dbe5ee}
.chip.on{background:#14463f;border-color:rgba(64,201,176,.5);color:#a8efe2}
</style>
<div class=glow></div>
<div class=mark><i style="height:40px"></i><i style="height:80px"></i><i style="height:60px"></i><i style="height:96px"></i><i style="height:50px"></i></div>
<div class=words><h1>Trindle Voice</h1>
<p>Text to speech that runs on your own computer, in pure Rust.</p>
<div class=chips><span class="chip on">No C++ to install</span><span class=chip>Ten voices</span><span class=chip>31 languages</span><span class=chip>GPL v3</span></div></div>

# What `cargo deny check` holds the dependencies to: licences that sit with
# GPL-3.0-or-later, crates.io as the only source, and no known vulnerability.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
